--
--  BayouGuru's New Modular Conky Config - CPU Section!
--  version:  2026-06-24
--
--  Sensor Cross Reference & Capabilities Chart:
--  hwmon4 - k10temp - AMD CPU          -  temp
--  hwmon6 - amdgpu - RX580 GPU         -  fan, temp, freq, in, power, pwm
--  hwmon7 - amdgpu - Integrated GPU    -  temp, freq, power
--
conky.config = {
out_to_x = false,
out_to_wayland = true,

update_interval = .5,
net_avg_samples = 1,
cpu_avg_samples = 1,
total_run_times = 0,

gap_x = 0,
gap_y = 0,
alignment = "top_left",
minimum_width = 260,
maximum_width = 260,
minimum_height = 312,

own_window = true,
own_window_type = "override",
own_window_hints = "sticky,skip_taskbar,skip_pager",
own_window_colour = "b7000000",

double_buffer = true,
show_graph_scale = false,
no_buffers = false,
pad_percents = 1,

font = "Larabiefont-Regular:bold:size=11",
text_buffer_size = 256,
short_units = true,
temperature_unit = "fahrenheit",
forced_redraw = false,

draw_graph_borders = false,
draw_outline = false,
draw_shades = true,
draw_borders = false,
border_inner_margin = 0,
border_outer_margin = 0,
border_width = 0,

default_outline_color = "000000",
default_color = "212121",
default_shade_color = "070707",

default_outline_color = "000000",
default_color = "212121",
default_shade_color = "070707",
color0 = '111111',
color1 = 'lightblue',
color2 = 'orange',
color3 = 'white',
color4 = 'SteelBlue',
template0 = '${font Larabiefont-Regular:bold:size=10}',
template1 = '${color4}${font Arial:size=10}',
lua_load = '/home/bayouguru/.conky/Wayland/conkycpubars-wayland.lua',
lua_draw_hook_pre = 'conky_conkycpubars_draw_pre',
lua_draw_hook_post = 'conky_conkycpubars_widgets'
}
conky.text = [[
${color3}${template0}${execi 86400 cat /proc/cpuinfo | grep 'model name' | sed -e 's/model name.*: //' | sed -e 's/Processor//'  | sed -e 's/(tm)/™/' | sed -e 's/(R)//' | sed -e 's/CPU//' | sed -e 's/@/:/' | sed -e 's/\ \ //' | sed -e 's/[0-9].[0-9][0-9]GHz//'|uniq}${color2}${alignr}${hwmon 4 temp 1}${color1}°F
${voffset 11}${template1}└${template0}${color1}1 ${color2}${cpu cpu1}${color1}%${goto 68}${color2}${if_match ${freq 1} < 1000} ${endif}${freq 1}${color1}MHz${goto 136}${template1}└${template0}${color1}2 ${color2}${cpu cpu2}${color1}%${alignr}${color2}${freq 2}${color1}MHz
${voffset 11}${template1}└${template0}${color1}3 ${color2}${cpu cpu3}${color1}%${goto 68}${color2}${if_match ${freq 3} < 1000} ${endif}${freq 3}${color1}MHz${goto 136}${template1}└${template0}${color1}4 ${color2}${cpu cpu4}${color1}%${alignr}${color2}${freq 4}${color1}MHz
${voffset 11}${template1}└${template0}${color1}5 ${color2}${cpu cpu5}${color1}%${goto 68}${color2}${if_match ${freq 5} < 1000} ${endif}${freq 5}${color1}MHz${goto 136}${template1}└${template0}${color1}6 ${color2}${cpu cpu6}${color1}%${alignr}${color2}${freq 6}${color1}MHz
${voffset 11}${template1}└${template0}${color1}7 ${color2}${cpu cpu7}${color1}%${goto 68}${color2}${if_match ${freq 7} < 1000} ${endif}${freq 7}${color1}MHz${goto 136}${template1}└${template0}${color1}8 ${color2}${cpu cpu8}${color1}%${alignr}${color2}${freq 8}${color1}MHz
${voffset 11}${template1}└${template0}${color1}9 ${color2}${cpu cpu9}${color1}%${goto 68}${color2}${if_match ${freq 9} < 1000} ${endif}${freq 9}${color1}MHz${goto 136}${template1}└${template0}${color1}10 ${color2}${cpu cpu10}${color1}%${alignr}${color2}${freq 10}${color1}MHz
${voffset 11}${template1}└${template0}${color1}11 ${color2}${cpu cpu11}${color1}%${goto 68}${color2}${if_match ${freq 11} < 1000} ${endif}${freq 11}${color1}MHz${goto 136}${template1}└${template0}${color1}12 ${color2}${cpu cpu12}${color1}%${alignr}${color2}${freq 12}${color1}MHz
${voffset 11}${template1}└${template0}${color1}Average${goto 120}${color2}${cpu cpu0}${color1}%${alignr}${color2}${freq 0}${color1}MHz
${color3}${template0}AMD RX580${color2}${alignr}${hwmon 6 temp 1}${color1}°F
${template1}├${color2}${template0}${alignr 225}${exec cat /sys/class/drm/card1/device/gpu_busy_percent}${color1}%
${template1}└${font} ${color1}Freq ${color2}${hwmon 6 freq 1 0.000001 1}${color1}MHz${alignr}${color1}Power ${color2}${hwmon 6 power 1 0.000001 1}${color1}W
${color3}${template0}AMD 7600X${color2}${alignr}${hwmon 7 temp 1}${color1}°F
${template1}├${color2}${template0}${alignr 225}${exec cat /sys/class/drm/card0/device/gpu_busy_percent}${color1}%
${template1}└${font} ${color1}Freq ${color2}${exec sensors -f | grep -A 6 'amdgpu-pci-7400' | grep 'sclk' | awk '{print $2}'}${color1}MHz${alignr}${color1}Power ${color2}${hwmon 7 power 1 0.000001 1}${color1}W]]
